[package]
name = "handshake"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Handshake protocol — canonical reference implementation. RFC 8785 JCS canonicalization, SHA-256, Ed25519, ML-DSA-65, plus serde models generated from the v0.2.3 JSON Schemas. The Python (PyO3) and TypeScript (NAPI-RS) SDKs are thin FFI shims over this crate."
repository = "https://github.com/handshake-protocol/handshake-ai"
rust-version = "1.78"

[lib]
name = "handshake"
crate-type = ["rlib"]

[dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
ml-dsa = { version = "0.1.0-rc.9", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_jcs = "0.1"
base64 = "0.22"
hex = "0.4"
thiserror = "2.0"
# Phase 2: timestamp parsing for the freshness window + chain walk windows.
# `chrono` is single-purpose here (no clock access — `now` is always passed in
# explicitly by the verifier context, which is mandatory for replayable
# conformance vectors).
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }

[dev-dependencies]
proptest = "1.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
